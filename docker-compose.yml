services:
  nestfund:
    image: ${NESTFUND_IMAGE:-eazyeight/nestfund:latest}
    container_name: nestfund
    restart: unless-stopped
    ports:
      - "${NESTFUND_PORT:-7777}:7777"
    # Optional values come from a .env file next to this file (see .env.example).
    environment:
      PORT: 7777
      DATA_DIR: /data
      TZ: ${TZ:-Europe/Lisbon}
      NESTFUND_SECRET: ${NESTFUND_SECRET:-}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    volumes:
      # SQLite database and uploaded attachments.
      - nestfund-data:/data
    labels:
      # Watchtower pulls new :latest images and recreates the container automatically.
      - com.centurylinklabs.watchtower.enable=true

volumes:
  nestfund-data:
