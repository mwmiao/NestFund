<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <title>NestFund</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0b0b0d; color: #f0f0f2; }
    main { max-width: 22rem; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { margin: 16px 0 8px; font-size: 1.35rem; }
    p { margin: 0 0 20px; color: #9d9da8; }
    button { font: inherit; font-weight: 600; min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #059669; color: #fff; cursor: pointer; }
    @media (prefers-color-scheme: light) { body { background: #f6f6f7; color: #18181b; } p { color: #65656e; } }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="72" height="72">
    <h1 data-pt="Sem ligação" data-en="You are offline">Sem ligação</h1>
    <p data-pt="Esta página ainda não foi guardada neste dispositivo. Volta a ligar-te à rede e tenta outra vez; os teus dados continuam seguros no servidor."
       data-en="This page has not been saved on this device yet. Reconnect and try again; your data is safe on the server.">Esta página ainda não foi guardada neste dispositivo. Volta a ligar-te à rede e tenta outra vez; os teus dados continuam seguros no servidor.</p>
    <button type="button" id="retry" data-pt="Tentar outra vez" data-en="Try again">Tentar outra vez</button>
  </main>
  <script>
    (function () {
      var en = /^en/i.test(navigator.language || '');
      if (en) {
        document.documentElement.lang = 'en-US';
        document.querySelectorAll('[data-en]').forEach(function (el) { el.textContent = el.getAttribute('data-en'); });
      }
      document.getElementById('retry').addEventListener('click', function () { location.href = '/'; });
    })();
  </script>
</body>
</html>
